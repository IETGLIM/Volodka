name: CI

on:
  push:
    # FIX v4.36.1: trigger vosstanovlen (byl povrezhden literal branches) - CI ne zapuskalsya na push/PR.
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

      - run: npm run validate:content

      # Гейт неприкосновенности авторского контента (v4.58.2): SHA-снапшот
      # стихов и канонических имён. Любое изменение текста стихов роняет CI
      # ДО сборки — облачная линия защиты вместе с hourly-guardian.
      - run: npm run validate:protected

      - run: npm run typecheck

      - run: npm run build

      # Этап 122: контроль бюджетов бандла и состава деплой-ассетов в CI.
      # Оба шага рассчитаны на запуск сразу после `npm run build` (без prune):
      # verify:deploy проверяет наличие обязательных путей в dist/ и размер деплоя.
      - name: Bundle budgets
        run: npm run budgets:check

      - name: Verify deploy assets
        run: npm run verify:deploy

      # Browser-level guard: the game must boot in Chromium and mount the WebGL canvas.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e:smoke

      # First playable slice: start a new game, validate movement, reach the corridor door.
      - name: First playable vertical slice
        run: npm run test:e2e:vertical-slice
