name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

      - run: npm run validate:content

      - run: npm run typecheck

      - run: npm run build

      # Этап 122: контроль бюджетов бандла и состава деплой-ассетов в CI.
      # Оба шага рассчитаны на запуск сразу после `npm run build` (без prune):
      # verify:deploy проверяет наличие обязательных путей в dist/ и размер деплоя.
      - name: Bundle budgets
        run: npm run budgets:check

      - name: Verify deploy assets
        run: npm run verify:deploy
