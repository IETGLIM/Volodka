name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run validate

      - run: npm run test:unit

      - run: npm run build

      - run: npm run budgets

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      # preview serves dist/ — check job builds on another runner, so build here too
      - run: npm run build

      # Golden path + critical flows (not smoke-only)
      - run: npx playwright test e2e/golden-path-act1.spec.ts e2e/save-load.spec.ts e2e/combat-flee.spec.ts e2e/scene-transition.spec.ts e2e/inventory-quest.spec.ts
